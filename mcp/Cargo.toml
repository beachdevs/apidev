[package]
name = "apicat-mcp"
version = "0.3.27"
edition = "2021"
description = "High-performance Model Context Protocol (MCP) server for apicat"
authors = ["Beachdevs"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", features = ["json", "tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
